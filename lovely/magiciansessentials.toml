[manifest]
version = "1.0.0"
dump_lua = true
priority = -1

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/game_object.lua"]'''
pattern = "if self.draw_hand == true then G.FUNCS.draw_from_deck_to_hand() end"
position = "after"
match_indent = true
payload = '''
if not self.draw_hand and next(SMODS.find_card('j_picubed_magiciansessentials')) then G.FUNCS.draw_from_deck_to_hand() end
'''